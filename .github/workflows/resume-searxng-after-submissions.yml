name: Resume SearXNG after community submissions
on:
  push:
    branches: [main]
    paths: ['scripts/reviewed-community-submissions-2026-09-09-3.json']
permissions:
  contents: write
concurrency:
  group: dictionary-writer
  cancel-in-progress: true
jobs:
  discover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery safeguards
        run: python -m unittest discover -s tests
      - name: Prepare SearXNG
        env:
          CONFIGURED_SEARXNG_URL: ${{ vars.SEARXNG_URL }}
        run: |
          if [ -n "$CONFIGURED_SEARXNG_URL" ]; then
            echo "SEARXNG_URL=$CONFIGURED_SEARXNG_URL" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/vname-searxng"
          cat > "$RUNNER_TEMP/vname-searxng/settings.yml" <<'YAML'
          use_default_settings:
            engines:
              keep_only: [youtube, duckduckgo, brave, bing]
          general:
            debug: false
            instance_name: vname-ci-searxng
          search:
            safe_search: 0
            formats: [html, json]
          server:
            secret_key: vname-ci-ephemeral-not-public
            limiter: false
            public_instance: false
            image_proxy: false
          YAML
          docker run -d --name vname-searxng \
            -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/vname-searxng:/etc/searxng:rw" \
            ghcr.io/searxng/searxng:2026.9.8-3fdc6d753@sha256:8bc27439bd3e201d493d1b6668c9d67a89b1d669af4d50c6f411b06c4fbc8de2
          for i in $(seq 1 40); do
            if curl --max-time 10 -fsS 'http://127.0.0.1:18080/search?q=VTuber&format=json' >/dev/null; then
              echo 'SEARXNG_URL=http://127.0.0.1:18080' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Search, verify and save batches
        env:
          QUERY_LIMIT: '1800'
          PAGES: '3'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -u scripts/run_ultra_sweep.py --limit "$QUERY_LIMIT" --pages "$PAGES" --batch 120 --seconds 5400 --resume --commit
      - name: Preserve collection progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: searxng-collection-${{ github.run_id }}
          path: |
            scripts/ultra-discovery-report.json
            scripts/search-discovery-report.json
            scripts/searxng-verification-report.json
            scripts/searxng-candidates.json
            scripts/collection-report.json
          retention-days: 14
      - name: Write collection summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('scripts/ultra-discovery-report.json')
          if p.exists():
              r=json.loads(p.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
                  for key in ('status','query_families_attempted','query_requests','new_candidates','new_public_records','existing_records_enriched'):
                      f.write(f'- {key}: {r.get(key, 0)}\n')
          PY
