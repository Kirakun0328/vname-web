name: One-time licensed source cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-licensed-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    # No Pages environment dependency; retry with reviewed-profile rendering test.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source policy tests
        run: python -m unittest discover -s tests
      - name: Restore explicitly reusable Taiwan archive records
        run: python scripts/restore_taiwan_unlicensed.py
      - name: Audit provenance
        run: python scripts/audit_legacy_external_data.py
      - name: Remove only unclear legacy external data
        run: python scripts/cleanup_legacy_external.py
      - name: Re-apply reviewed records
        run: python scripts/update_dictionary.py --reviewed-only
      - name: Validate JavaScript and source policy
        run: |
          node --check data.js
          node --check extra-data.js
          node --check platform-data.js
          node --experimental-vm-modules --test tests/*.cjs
          python -m unittest discover -s tests
      - name: Commit cleaned data and reports
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.js extra-data.js platform-data.js readings.js scripts/*.json
            git commit -m 'Finalize license-aware legacy data cleanup'
            git push origin HEAD:main
          fi
