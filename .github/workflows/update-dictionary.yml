name: Update dictionary and publish
on:
  schedule:
    - cron: '17 */6 * * *' # Multi-source discovery four times daily.
    - cron: '7 * * * *' # Hourly public audience snapshots and queued Gemma readings.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dictionary.yml'
      - 'scripts/*.py'
      - 'scripts/*.json'
      - 'tests/**'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'index.html'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dictionary-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater safeguards
        run: python -m unittest discover -s tests
      - name: Fetch and validate dictionary
        if: github.event_name != 'push' && github.event.schedule != '7 * * * *'
        run: python scripts/update_dictionary.py
      - name: Fetch V-livers across platforms
        if: github.event_name != 'push' && github.event.schedule != '7 * * * *'
        run: python scripts/update_platform_dictionary.py
      - name: Apply verified community additions and renames
        run: python scripts/update_dictionary.py --reviewed-only
      - name: Refresh public audience counts
        run: python scripts/update_audience.py
      - uses: actions/cache@v4
        with:
          path: .cache/registration-review
          key: gemma-e2b-review-b4243c1-llama-b10809-v1
      - name: Estimate queued readings with local Gemma
        run: python scripts/estimate_readings.py --limit 200 --seconds 900
      - name: Validate JavaScript
        run: |
          node --check estimated-readings.js
          node --check audience-data.js
          node --check extra-data.js
          node --check app.js
          node --check community.js
          node --check platforms.js
          node --check platform-data.js
          node --check naming.js
          node --check name-insights.js
          node --check ai-model.js
          node --experimental-vm-modules --test tests/*.cjs
          node --check i18n.js
      - name: Commit dictionary changes
        run: |
          if ! git diff --quiet -- extra-data.js platform-data.js estimated-readings.js audience-data.js audience-data.json scripts/audience-report.json scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json || test -n "$(git ls-files --others --exclude-standard scripts/collection-report.json estimated-readings.js audience-data.js audience-data.json scripts/audience-report.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add extra-data.js platform-data.js estimated-readings.js audience-data.js audience-data.json scripts/audience-report.json scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json
            git commit -m 'Update dictionary from public sources'
            git push origin HEAD:main
          fi
      - name: Package public files
        run: |
          mkdir -p _site/assets _site/scripts
          cp index.html app.js data.js extra-data.js estimated-readings.js audience-data.js audience-data.json platform-data.js platforms.js naming.js name-insights.js ai-model.js site.css naming.css readings.js i18n.js .nojekyll _site/
          cp assets/naming-robot.png _site/assets/
          cp community.js _site/
          cp scripts/registration-config.json _site/scripts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish updated site
        id: deployment
        uses: actions/deploy-pages@v4
