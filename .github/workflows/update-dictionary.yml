name: Update dictionary and publish
on:
  schedule:
    - cron: '17 21 * * *' # Around 06:17 JST daily; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dictionary.yml'
      - 'scripts/*.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dictionary-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater safeguards
        run: python -m unittest discover -s tests
      - name: Fetch and validate dictionary
        run: python scripts/update_dictionary.py
      - name: Validate JavaScript
        run: |
          node --check extra-data.js
          node --check app.js
          node --check i18n.js
      - name: Commit dictionary changes
        run: |
          if ! git diff --quiet -- extra-data.js scripts/collection-report.json || test -n "$(git ls-files --others --exclude-standard scripts/collection-report.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add extra-data.js scripts/collection-report.json
            git commit -m 'Update dictionary from public sources'
            git push origin HEAD:main
          fi
      - name: Package public files
        run: |
          mkdir -p _site
          cp index.html app.js data.js extra-data.js readings.js i18n.js .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish updated site
        id: deployment
        uses: actions/deploy-pages@v4
