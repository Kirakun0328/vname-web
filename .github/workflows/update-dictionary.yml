name: Update dictionary
on:
  schedule:
    - cron: '17 */6 * * *' # Recheck individually approved/official profiles.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dictionary.yml'
      - 'scripts/*.py'
      - 'scripts/*.json'
      - 'tests/**'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'index.html'
      - 'README.md'
      - 'DATA_SOURCES.md'
permissions:
  contents: write
concurrency:
  group: dictionary-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater safeguards
        run: python -m unittest discover -s tests
      - name: Restore explicitly reusable Taiwan archive records
        run: python scripts/restore_taiwan_unlicensed.py
      - name: Audit legacy external provenance
        run: python scripts/audit_legacy_external_data.py
      - name: Remove unclear legacy external-directory data
        run: python scripts/cleanup_legacy_external.py
      - name: Import explicitly open VTuber datasets
        if: github.event_name != 'push' || github.event.head_commit.message == 'Import explicitly open VTuber datasets'
        run: python scripts/import_open_datasets.py
      - name: Import CC0 AI VTuber dataset
        if: github.event_name != 'push' || github.event.head_commit.message == 'Import CC0 AI VTuber dataset'
        run: python scripts/import_aivtuber_cc0.py
      - name: Apply individually reviewed additions and corrections
        run: python scripts/update_dictionary.py --reviewed-only
      - name: Prepare SearXNG endpoint for discovery
        if: github.event_name != 'push' || github.event.head_commit.message == 'Run broad specialist SearXNG discovery'
        env:
          CONFIGURED_SEARXNG_URL: ${{ vars.SEARXNG_URL }}
        run: |
          if [ -n "$CONFIGURED_SEARXNG_URL" ]; then
            echo "VNAME_SEARXNG_URL=$CONFIGURED_SEARXNG_URL" >> "$GITHUB_ENV"
            echo "Using configured SearXNG endpoint"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/vname-searxng"
          cat > "$RUNNER_TEMP/vname-searxng/settings.yml" <<'YAML'
          use_default_settings:
            engines:
              keep_only:
                - youtube
                - duckduckgo
                - brave
                - bing
          general:
            debug: false
            instance_name: "vname-ci-searxng"
          search:
            safe_search: 0
            formats:
              - html
              - json
          server:
            secret_key: "vname-ci-ephemeral-not-public"
            limiter: false
            public_instance: false
            image_proxy: false
          YAML
          docker run -d --name vname-searxng \
            -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/vname-searxng:/etc/searxng:rw" \
            ghcr.io/searxng/searxng:2026.9.8-3fdc6d753@sha256:8bc27439bd3e201d493d1b6668c9d67a89b1d669af4d50c6f411b06c4fbc8de2
          for i in $(seq 1 40); do
            if curl -fsS 'http://127.0.0.1:18080/search?q=vtuber&format=json' >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS 'http://127.0.0.1:18080/search?q=vtuber&format=json' >/dev/null
          echo "VNAME_SEARXNG_URL=http://127.0.0.1:18080" >> "$GITHUB_ENV"
          echo "Started ephemeral local SearXNG"
      - name: Discover broad specialist VTuber candidates with SearXNG
        if: github.event_name != 'push' || github.event.head_commit.message == 'Run broad specialist SearXNG discovery'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SEARXNG_URL="$VNAME_SEARXNG_URL" python scripts/discover_primary_search.py --limit 80 --pages 2
          else
            SEARXNG_URL="$VNAME_SEARXNG_URL" python scripts/discover_primary_search.py --limit 24 --pages 2
          fi
      - name: Verify SearXNG leads against direct creator profiles
        if: github.event_name != 'push' || github.event.head_commit.message == 'Run broad specialist SearXNG discovery'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/verify_searxng_candidates.py --limit 800 --workers 6
          else
            python scripts/verify_searxng_candidates.py --limit 300 --workers 5
          fi
      - name: Recount dictionary after imports
        run: python scripts/recount_dictionary.py
      - name: Recheck individual official profiles
        run: python scripts/reverify_primary.py ${{ github.event_name == 'push' && '--offline' || '--limit 40' }}
      - uses: actions/cache@v4
        if: github.event_name != 'push'
        with:
          path: .cache/registration-review
          key: gemma-e2b-review-b4243c1-llama-b10809-v1
      - name: Estimate queued readings with local Gemma
        if: github.event_name != 'push'
        run: python scripts/estimate_readings.py --limit 200 --seconds 900
      - name: Validate JavaScript
        run: |
          node --check data.js
          node --check estimated-readings.js
          node --check primary-data.js
          node --check extra-data.js
          node --check app.js
          node --check community.js
          node --check platforms.js
          node --check platform-data.js
          node --check naming.js
          node --check name-insights.js
          node --check ai-model.js
          node --experimental-vm-modules --test tests/*.cjs
          node --check i18n.js
      - name: Commit dictionary changes
        run: |
          if ! git diff --quiet -- data.js scripts/licensed-legacy-restore-report.json scripts/open-datasets-report.json scripts/aivtuber-cc0-report.json scripts/legacy-data-audit.json scripts/legacy-cleanup-report.json scripts/search-discovery-report.json scripts/searxng-candidates.json scripts/searxng-verification-report.json primary-data.js scripts/primary-recheck-report.json extra-data.js platform-data.js estimated-readings.js scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json || test -n "$(git ls-files --others --exclude-standard scripts/licensed-legacy-restore-report.json scripts/open-datasets-report.json scripts/aivtuber-cc0-report.json scripts/legacy-data-audit.json scripts/legacy-cleanup-report.json scripts/search-discovery-report.json scripts/searxng-candidates.json scripts/searxng-verification-report.json scripts/collection-report.json estimated-readings.js scripts/audience-report.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.js scripts/licensed-legacy-restore-report.json scripts/open-datasets-report.json scripts/aivtuber-cc0-report.json scripts/legacy-data-audit.json scripts/legacy-cleanup-report.json scripts/search-discovery-report.json scripts/searxng-candidates.json scripts/searxng-verification-report.json primary-data.js scripts/primary-recheck-report.json extra-data.js platform-data.js estimated-readings.js scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json
            git commit -m 'Update dictionary from reviewed open and verified search sources'
            git push origin HEAD:main
          fi
      # GitHub's branch-based Pages build is the sole publisher.
