name: Update dictionary and publish
on:
  schedule:
    - cron: '17 */6 * * *' # Recheck individually approved/official profiles.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dictionary.yml'
      - 'scripts/*.py'
      - 'scripts/*.json'
      - 'tests/**'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'index.html'
      - 'README.md'
      - 'DATA_SOURCES.md'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dictionary-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater safeguards
        run: python -m unittest discover -s tests
      - name: Restore explicitly reusable Taiwan archive records
        run: python scripts/restore_taiwan_unlicensed.py
      - name: Audit legacy external provenance
        run: python scripts/audit_legacy_external_data.py
      - name: Remove unclear legacy external-directory data
        run: python scripts/cleanup_legacy_external.py
      - name: Import explicitly open VTuber datasets
        if: github.event_name != 'push' || github.event.head_commit.message == 'Import explicitly open VTuber datasets'
        run: python scripts/import_open_datasets.py
      - name: Apply individually reviewed additions and corrections
        run: python scripts/update_dictionary.py --reviewed-only
      - name: Discover primary-source candidates with configured SearXNG
        if: github.event_name != 'push'
        env:
          SEARXNG_URL: ${{ vars.SEARXNG_URL }}
        run: python scripts/discover_primary_search.py --limit 4
      - name: Recheck individual official profiles
        run: python scripts/reverify_primary.py ${{ github.event_name == 'push' && '--offline' || '--limit 40' }}
      - uses: actions/cache@v4
        if: github.event_name != 'push'
        with:
          path: .cache/registration-review
          key: gemma-e2b-review-b4243c1-llama-b10809-v1
      - name: Estimate queued readings with local Gemma
        if: github.event_name != 'push'
        run: python scripts/estimate_readings.py --limit 200 --seconds 900
      - name: Validate JavaScript
        run: |
          node --check data.js
          node --check estimated-readings.js
          node --check primary-data.js
          node --check extra-data.js
          node --check app.js
          node --check community.js
          node --check platforms.js
          node --check platform-data.js
          node --check naming.js
          node --check name-insights.js
          node --check ai-model.js
          node --experimental-vm-modules --test tests/*.cjs
          node --check i18n.js
      - name: Commit dictionary changes
        run: |
          if ! git diff --quiet -- data.js scripts/licensed-legacy-restore-report.json scripts/open-datasets-report.json scripts/legacy-data-audit.json scripts/legacy-cleanup-report.json scripts/search-discovery-report.json scripts/searxng-candidates.json primary-data.js scripts/primary-recheck-report.json extra-data.js platform-data.js estimated-readings.js scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json || test -n "$(git ls-files --others --exclude-standard scripts/licensed-legacy-restore-report.json scripts/open-datasets-report.json scripts/legacy-data-audit.json scripts/legacy-cleanup-report.json scripts/collection-report.json estimated-readings.js scripts/audience-report.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.js scripts/licensed-legacy-restore-report.json scripts/open-datasets-report.json scripts/legacy-data-audit.json scripts/legacy-cleanup-report.json scripts/search-discovery-report.json scripts/searxng-candidates.json primary-data.js scripts/primary-recheck-report.json extra-data.js platform-data.js estimated-readings.js scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json
            git commit -m 'Update dictionary from reviewed and open licensed sources'
            git push origin HEAD:main
          fi
      - name: Package public files
        run: |
          mkdir -p _site/assets _site/scripts
          cp DATA_SOURCES.md primary-data.js index.html app.js data.js extra-data.js estimated-readings.js platform-data.js platforms.js naming.js name-insights.js ai-model.js site.css naming.css readings.js i18n.js .nojekyll _site/
          cp assets/naming-robot.png assets/text-to-vrma.png _site/assets/
          cp community.js _site/
          cp scripts/registration-config.json _site/scripts/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish updated site
        id: deployment
        uses: actions/deploy-pages@v4
