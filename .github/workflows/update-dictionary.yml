name: Update dictionary and publish
on:
  schedule:
    - cron: '17 21 * * *' # Around 06:17 JST daily; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-dictionary.yml'
      - 'scripts/*.py'
      - 'scripts/*.json'
      - 'tests/**'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'index.html'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dictionary-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test updater safeguards
        run: python -m unittest discover -s tests
      - name: Fetch and validate dictionary
        if: github.event_name != 'push'
        run: python scripts/update_dictionary.py
      - name: Fetch V-livers across platforms
        if: github.event_name != 'push'
        run: python scripts/update_platform_dictionary.py
      - name: Validate JavaScript
        run: |
          node --check extra-data.js
          node --check app.js
          node --check platforms.js
          node --check platform-data.js
          node --check naming.js
          node --check name-insights.js
          node --check ai-model.js
          node --experimental-vm-modules --test tests/*.cjs
          node --check i18n.js
      - name: Commit dictionary changes
        run: |
          if ! git diff --quiet -- extra-data.js platform-data.js scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json scripts/aivnav_channels.json || test -n "$(git ls-files --others --exclude-standard scripts/collection-report.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add extra-data.js platform-data.js scripts/collection-report.json scripts/platform-report.json scripts/aivnav_channels.json scripts/aivnav_channels.json
            git commit -m 'Update dictionary from public sources'
            git push origin HEAD:main
          fi
      - name: Package public files
        run: |
          mkdir -p _site/assets
          cp index.html app.js data.js extra-data.js platform-data.js platforms.js naming.js name-insights.js ai-model.js site.css naming.css readings.js i18n.js .nojekyll _site/
          cp assets/naming-robot.png _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish updated site
        id: deployment
        uses: actions/deploy-pages@v4
